project:
  name: "ИКИОМА ОС"
  owner: "Виталий Озолин"
  scope: "Операционная система управления строительством частных домов ИКИОМА"
  passport_status: approved
  actual_at: "2026-08-14"
  goal: "Независимый закрытый боевой контур с проектами, задачами, финансами, снабжением, качеством, документами и автоматизациями"
  completion_criteria:
    - "Система работает на отдельном VPS Timeweb"
    - "Данные хранятся в отдельной PostgreSQL"
    - "Документы и фото вынесены в файловое хранилище"
    - "Есть закрытый вход, резервные копии и проверенный откат"
    - "Основные сценарии и роли проходят автоматические и ручные проверки"
    - "После снятия блокировки домена подключены DNS и Telegram webhook"
    - "Заявки с ikioma.ru записываются в отдельный входящий поток и доступны только владельцу"
    - "Telegram всегда сообщает, распознано ли обращение и было ли что-либо сохранено; записи и изменения требуют подтверждения"
  current_stage: "Безопасный автоматический релиз на Timeweb"
  current_step:
    owner: "Codex + Виталий"
    action: "Подключить один ограниченный deploy-ключ и защищённое GitHub Environment, затем выполнить первый проверенный релиз"
    due: "после слияния deploy-контура и одноразовой установки ключа"
    expected_result: "Успешный CI exact SHA автоматически создаёт проверенную копию и переключает app+relay; ошибка возвращает предыдущие образы без автоматического восстановления данных"
    evidence: "72 автоматические проверки, shell syntax, TypeScript, production build и импорт полного Sites-артефакта проходят; схема завершается до HTTP listen, read-only readiness проверяет version marker и не изменяет БД; Docker build проверяется CI; backup заранее проверяет вместимость по полному размеру БД и файлов, а COMPLETE появляется только после checksum и durable rename; после одноразовой установки — STROIOS_DEPLOY_OK exact SHA, внешний readiness exact SHA, Telegram getMe и exact HTTPS webhook через relay"
  infrastructure:
    provider: "Timeweb Cloud"
    server: "stroios-prod / Wild Cygnus"
    ipv4: "188.225.38.55"
    resources: "2 vCPU, 4 GB RAM, 50 GB NVMe"
    isolation: "Отдельный VPS и отдельные данные от Agro"
  constraints:
    - "Не переносить тестовые данные"
    - "Не менять DNS до проверки временного адреса"
    - "Не публиковать секреты Telegram и не считать интеграцию проверенной без полученного тестового сообщения"
    - "Не хранить runtime-секреты в GitHub; единственное исключение — отдельный отзывной deploy-ключ в защищённом Environment, ограниченный одной root-owned командой"
  risks:
    - id: domain_hold
      status: open
      owner: "Beget/OpenAI support"
      mitigation: "Тестировать по IP, DNS переключить после снятия блокировки"
    - id: server_access
      status: open
      owner: "Виталий"
      mitigation: "Использовать отдельный отзывной SSH-ключ, не пересылать root-пароль"
    - id: public_lead_ingress
      status: review
      owner: "Codex"
      mitigation: "Разрешить только origin ikioma.ru, валидировать поля, использовать honeypot и дедупликацию"
    - id: telegram_silent_drop
      status: fixing
      owner: "Codex"
      mitigation: "Отключить Privacy Mode через BotFather; команды и доставленные адресованные обращения всегда завершаются явным ответом, ошибки sendMessage фиксируются"
    - id: telegram_webhook_drift
      status: closed
      owner: "Codex"
      mitigation: "setWebhook автоматически восстанавливается при каждом старте без очистки очереди; после развёртывания личные команды отвечают моментально"
    - id: telegram_project_context
      status: fixing
      owner: "Codex"
      mitigation: "Хранить активный проект по паре Telegram-пользователь + чат; не использовать последний подключённый проект как неявный выбор; подтверждать права по проекту черновика; принимать команды в группе только из подтверждённого общего чата"
    - id: telegram_duplicate_write
      status: fixing
      owner: "Codex"
      mitigation: "Атомарно переводить черновик draft → processing перед изменением, использовать стабильный sourceDraftId в проектных данных и проверять актуальные связи расхода внутри CAS-мутации"
    - id: telegram_notification_delivery
      status: fixing
      owner: "Codex"
      mitigation: "Сохранять исходящие сообщения в durable outbox до отправки, захватывать каждую доставку атомарной lease-записью и автономно повторять её с backoff каждые 30 секунд до успеха"
    - id: telegram_container_egress
      status: closed
      owner: "Codex"
      mitigation: "Закрытый host-network relay с принудительным IPv6 развёрнут; два нажатия кнопки ОС дали два реально полученных Telegram-сообщения 2026-08-13"
    - id: deployment_automation
      status: configuring
      owner: "Codex + Виталий"
      mitigation: "Exact CI SHA, forced-command SSH key без shell/docker, единый maintenance flock, verified backup с ограничением по сроку/количеству, постоянные SHA-образы, schema marker + read-only readiness, Telegram regression probe и доказанный rollback только кода"
  decisions:
    - date: "2026-08-05"
      decision: "Timeweb Cloud выбран вместо Beget для единой панели с Agro"
    - date: "2026-08-05"
      decision: "Agro и ИКИОМА ОС размещаются на разных VPS"
    - date: "2026-08-05"
      decision: "Sites остаётся резервным стендом на время миграции"
    - date: "2026-08-05"
      decision: "Заявки ikioma.ru поступают в lead_inbox под техническим проектом ikioma-sales и видны владельцу в Маркетинге"
    - date: "2026-08-12"
      decision: "Кабинет клиента остаётся отдельной клиентской ролью и скрывается из рабочей области управления"
    - date: "2026-08-12"
      decision: "После завершения или закрытия обучения его место занимает постоянный раздел Правки разработчику"
    - date: "2026-08-13"
      decision: "Обычный групповой чат не записывается автоматически; все изменения Telegram проходят через черновик и подтверждение, а нераспознанные обращения получают явный ответ"
    - date: "2026-08-13"
      decision: "После двух нестабильных попыток прямой IPv6-маршрутизации Docker исходящие Telegram-запросы переводятся через локальный host-network relay; этап не закрывается без реального уведомления из ОС"
    - date: "2026-08-13"
      decision: "Исходящий Telegram-канал принят: два нажатия кнопки теста в ИКИОМА ОС создали два сообщения «тест канала Telegram для проекта H-001» в общем чате; следующий незакрытый контур — входящие команды webhook"
    - date: "2026-08-14"
      decision: "Скриншот подтвердил: исходящие уведомления приходят, а /help и адресованная фраза остаются без ответа; webhook восстанавливается автоматически при каждом старте без удаления очереди Telegram"
    - date: "2026-08-14"
      decision: "При нескольких доступных проектах бот обязан уточнять объект перед задачей, заметкой, расходом, документом или отчётом; активный проект хранится отдельно для каждого пользователя и каждого чата"
    - date: "2026-08-14"
      decision: "Свободные обращения @ikioma_bot в общем чате требуют отключённого Privacy Mode; обычная групповая переписка всё равно отсекается приложением и не сохраняется"
    - date: "2026-08-14"
      decision: "Выбор проекта принадлежит конкретному Telegram-пользователю в конкретном чате; групповые команды разрешены только в подтверждённом общем чате, а каждое подтверждение черновика идемпотентно"
    - date: "2026-08-14"
      decision: "Уведомление из ОС считается доставленным только после успешного ответа Telegram; временная ошибка сохраняется в очереди и повторяется автономно, параллельные обработчики не отправляют одно сообщение одновременно"
    - date: "2026-08-14"
      decision: "Для автодеплоя разрешён только отдельный отзывной SSH deploy-ключ в защищённом GitHub Environment; ключ не имеет shell, Docker или произвольного sudo, а runtime-секреты остаются только на VPS"
    - date: "2026-08-14"
      decision: "Readiness не выполняет миграции и очистку данных; backup проверяется до переключения, автоматический rollback меняет только код и образы, восстановление PostgreSQL и файлов всегда отдельное ручное действие"
    - date: "2026-08-14"
      decision: "Миграция схемы завершается до открытия HTTP-порта и фиксируется version marker; readiness только читает markers. Уже существующая внешняя недоступность Telegram не откатывает здоровую ОС, но регрессия работавшего канала блокирует релиз"
  ai_contract:
    input: "Исходники v17, конфигурация VPS, подтверждённые продуктовые решения"
    expected_result: "Проверенная сборка и безопасное воспроизводимое развёртывание"
    allowed_actions: ["изменять исходники", "запускать тесты", "публиковать в указанном приватном репозитории", "запускать exact-SHA deploy через ограниченный forced-command ключ после успешного CI"]
    forbidden_actions: ["публиковать runtime-секреты", "использовать root-пароль или произвольный SSH", "автоматически восстанавливать или удалять боевые данные", "переключать DNS без проверки", "включать Telegram до разрешения"]
    responsible_human: "Виталий Озолин"
    execution_cost: "в пределах текущей рабочей сессии; инфраструктура 1332 ₽/месяц"
    value_metric: "Успешное развёртывание без ручной сборки и без тестовых данных"
    auto_stop: "Ошибка миграции, неоднозначный доступ или риск потери данных"
    opt_out: "Можно остановить перенос; Sites продолжит работать, новые данные на VPS обрабатываться не будут"
