    - decision_id: "IKIOMA-ACCESS-2026-08-17-01"
      project_id: "ikioma-os"
      status: active
      question: "Как выдавать сотруднику доступ при наличии нескольких проектов?"
      statement: "При первой выдаче веб-доступа по умолчанию отмечаются все существующие боевые проекты; владелец может снять или вернуть любой проект в единой матрице. Новые проекты автоматически не наследуют доступ. Telegram-привязка остаётся независимой."
      context: "Боевая проверка показала, что кнопка «Выдать доступ» создаёт membership только выбранного проекта, а при переходе в другой проект тот же сотрудник снова отображается без веб-доступа."
      rationale: "Один сотрудник должен активировать один аккаунт и сразу работать на разрешённых объектах, а владелец — управлять исключениями без повторных приглашений. Запрет автодоступа к будущим проектам сохраняет контроль над новыми объектами."
      evidence:
        - "Скриншот владельца от 2026-08-17: в проекте H-001 у сотрудников отображается «Не выдан» после выдачи в другом проекте"
        - "Существующая PostgreSQL-модель auth_users + auth_memberships поддерживает один аккаунт и несколько изолированных membership"
      assumptions:
        - "Email остаётся устойчивым идентификатором одного человека между проектами"
        - "Роль уже существующего профиля сохраняется отдельно в каждом проекте; при первом добавлении в проект копируется текущая роль"
      approved_by: "Виталий Озолин"
      approved_at: "2026-08-17"
      owner: "Codex"
      deadline: "до следующей выдачи доступа сотруднику"
      review_at: "после первой реальной многопроектной активации"
      affected_stages: ["персональный веб-доступ", "боевая приёмка"]
      dependencies: ["PostgreSQL auth_memberships", "owner-only access API", "однократная ссылка активации"]
