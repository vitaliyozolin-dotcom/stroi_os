project:
  name: "ИКИОМА ОС"
  owner: "Виталий Озолин"
  scope: "Операционная система управления строительством частных домов ИКИОМА"
  passport_status: approved
  actual_at: "2026-08-11"
  goal: "Независимый закрытый боевой контур с проектами, задачами, финансами, снабжением, качеством, документами и автоматизациями"
  completion_criteria:
    - "Система работает на отдельном VPS Timeweb"
    - "Данные хранятся в отдельной PostgreSQL"
    - "Документы и фото вынесены в файловое хранилище"
    - "Есть закрытый вход, резервные копии и проверенный откат"
    - "Основные сценарии и роли проходят автоматические и ручные проверки"
    - "Значимые события ИКИОМА ОС надёжно доставляются в общий Telegram-чат без дублей и с повторными попытками"
    - "После снятия блокировки домена подключён основной DNS; Telegram продолжает работать через действующий HTTPS-контур"
  current_stage: "Персональные доступы и коммуникации"
  current_step:
    owner: "Codex + Виталий"
    action: "Подключить надёжную доставку всех значимых событий ИКИОМА ОС в существующий общий Telegram-чат ИкиОМА"
    due: "текущая итерация"
    expected_result: "Задачи, этапы, деньги, снабжение, качество, заявки, документы, решения и полевые отчёты приходят в общий чат один раз, содержат автора и прямую ссылку; временный сбой Telegram автоматически повторяется"
    evidence: "Целевые тесты событий, зелёная production-сборка, записи notification_deliveries со статусом sent, реальное тестовое событие в общем чате"
  infrastructure:
    provider: "Timeweb Cloud"
    server: "stroios-prod / Wild Cygnus"
    ipv4: "188.225.38.55"
    resources: "2 vCPU, 4 GB RAM, 50 GB NVMe"
    isolation: "Отдельный VPS и отдельные данные от Agro"
  constraints:
    - "Не переносить тестовые данные"
    - "Не менять DNS до проверки временного адреса"
    - "Не публиковать Telegram-токен и chat_id; использовать уже настроенный бот и существующий общий чат"
    - "Не отправлять в общий чат обычные сохранения и технический шум"
    - "Не хранить секреты в GitHub"
  risks:
    - id: runtime_artifact_completeness
      status: mitigated
      owner: "Codex"
      mitigation: "Runtime-образ копирует весь каталог sites; CI импортирует worker.js внутри готового Docker-образа и падает при отсутствующей зависимости"
    - id: domain_hold
      status: open
      owner: "Beget/OpenAI support"
      mitigation: "Тестировать по IP, DNS переключить после снятия блокировки"
    - id: server_access
      status: open
      owner: "Виталий"
      mitigation: "Использовать отдельный отзывной SSH-ключ, не пересылать root-пароль"
    - id: email_delivery
      status: closed
      owner: "Виталий + Codex"
      mitigation: "Выдача доступов больше не зависит от email-провайдера; почта остаётся только необязательным каналом уведомлений"
    - id: telegram_delivery
      status: mitigated
      owner: "Codex"
      mitigation: "Устойчивая очередь notification_deliveries, защита от дублей, до 8 повторов и восстановление зависшей отправки через health-check"
    - id: manual_invite_leak
      status: open
      owner: "Виталий"
      mitigation: "Ссылка действует 48 часов, хранится на сервере только как SHA-256, используется один раз и передаётся адресату лично"
  decisions:
    - date: "2026-08-05"
      decision: "Timeweb Cloud выбран вместо Beget для единой панели с Agro"
    - date: "2026-08-05"
      decision: "Agro и ИКИОМА ОС размещаются на разных VPS"
    - date: "2026-08-05"
      decision: "Sites остаётся резервным стендом на время миграции"
    - date: "2026-08-06"
      decision: "Доступы выдаются по обычной почте через персональные аккаунты ИКИОМА ОС; аккаунт ChatGPT больше не требуется"
    - date: "2026-08-10"
      decision: "Почтовый провайдер исключён из контура авторизации: администратор копирует одноразовую ссылку, пользователь сам создаёт пароль"
    - date: "2026-08-10"
      decision: "Владелец подтвердил персональный вход и выдачу доступов сотрудникам; контур авторизации работает на VPS"
    - date: "2026-08-10"
      decision: "Во вкладке браузера ИКИОМА ОС используется оригинальный знак ИКИОМА"
    - date: "2026-08-10"
      decision: "Система переименована из СтройОС в ИКИОМА ОС во всех пользовательских интерфейсах и коммуникациях; технические идентификаторы сохранены для совместимости"
    - date: "2026-08-11"
      decision: "ИКИОМА ОС остаётся только внутренней системой: клиентская роль и кабинет отключены; профиль получает рабочий выход; минимальная длина пароля снижена до 10 символов"
    - date: "2026-08-11"
      decision: "Существующий общий чат ИкиОМА становится оперативным каналом значимых событий; обычные сохранения не отправляются; Telegram-доставка фиксируется и повторяется при временном сбое"
  ai_contract:
    input: "Исходники v17, конфигурация VPS, подтверждённые продуктовые решения"
    expected_result: "Проверенная сборка и доказанная доставка значимых событий в общий Telegram-чат"
    allowed_actions: ["изменять исходники", "запускать тесты", "публиковать в указанном приватном репозитории"]
    forbidden_actions: ["публиковать секреты", "удалять боевые данные", "переключать DNS без проверки", "отправлять технический шум и персональные данные вне согласованного чата"]
    responsible_human: "Виталий Озолин"
    execution_cost: "в пределах текущей рабочей сессии; инфраструктура 1332 ₽/месяц"
    value_metric: "100% значимых событий поставлены в очередь; нет дублей; временные ошибки Telegram повторяются автоматически"
    auto_stop: "8 неудачных попыток доставки, недоступный бот или неоднозначный общий чат — остановить повтор и показать блокер владельцу"
    opt_out: "Владелец может отключить общий Telegram-чат; ИКИОМА ОС и браузерные уведомления продолжат работать, новые события в Telegram отправляться не будут, журнал прежних доставок сохранится"

