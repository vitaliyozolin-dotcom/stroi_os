name: Check StroiOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stroios_auth_test
          POSTGRES_USER: stroios_test
          POSTGRES_PASSWORD: stroios_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stroios_test -d stroios_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgresql://stroios_test:stroios_test_password@127.0.0.1:5432/stroios_auth_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash -n scripts/*.sh
      - run: npm run build
      - run: node --input-type=module -e "await import('./dist/server/index.js')"
      - run: docker build -t stroios:test .
