name: Check IKIOMA OS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:vps
      - run: docker build -t stroios:test .
      - name: Verify server modules inside runtime image
        run: docker run --rm --entrypoint node stroios:test --input-type=module -e "await import('./sites/worker.js')"
